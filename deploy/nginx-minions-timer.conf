# Included inside the HTTPS minionsofdarkness.com server block. This is a
# static-only boundary: no URI below /timer/ can fall through to the game app.
location = /timer {
    return 301 /timer/;
    limit_except GET { deny all; }
}

location = /timer/ {
    limit_except GET { deny all; }
    rewrite ^ /timer/index.html last;
}

location = /timer/manifest.webmanifest {
    alias /opt/minions-timer/current/web/manifest.webmanifest;
    default_type application/manifest+json;
    expires -1;
    limit_except GET { deny all; }
}

location = /timer/service-worker.js {
    alias /opt/minions-timer/current/web/service-worker.js;
    default_type application/javascript;
    expires -1;
    limit_except GET { deny all; }
}

location /timer/ {
    alias /opt/minions-timer/current/web/;
    autoindex off;
    expires -1;
    limit_except GET { deny all; }
}
